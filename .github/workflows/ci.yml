name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-oracle:
    name: Web + Oracle (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generate only needs a syntactically valid URL; tests mock the DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        working-directory: packages/db

      - name: Typecheck web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Typecheck oracle
        run: npm run lint
        working-directory: apps/oracle

      - name: Test web
        run: npm test
        working-directory: apps/web

      - name: Test oracle
        run: npm test
        working-directory: apps/oracle

  contracts:
    name: Soroban contract (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Test
        run: cargo test
        working-directory: packages/contracts

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release
        working-directory: packages/contracts

  migrate:
    name: Prisma migrate deploy
    needs: [web-oracle, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      # Direct (non-pooled) connection string, set under Settings > Secrets > Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set; skipping would hide unapplied migrations."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install only the pinned Prisma CLI; no need for the full monorepo.
      - name: Apply migrations
        run: npx --yes prisma@6.19.3 migrate deploy --schema packages/db/prisma/schema.prisma
